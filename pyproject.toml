[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cartha-subnet-validator"
version = "1.2.0"
description = "Cartha subnet validator reference implementation."
requires-python = ">=3.11,<3.12"
authors = [
  { name = "Cartha Contributors" },
]
readme = "README.md"
dependencies = [
  # Floor 10.5.0: Finney runtime spec_version 432 wraps neurons_lite's
  # netuid param in a Composite {u16}. bittensor<=10.2.1 (ASI <2 / scalecodec)
  # encodes a bare int and crashes metagraph sync with
  # "Invalid type for data ... Composite". 10.5.0 + ASI>=2.2.1 (cyscale)
  # encodes correctly. Cap <11 to avoid the bittensor-core rewrite in 11.x.
  "bittensor>=10.5.0,<11",
  "async-substrate-interface>=2.2.1,<3",
  "web3>=6.11,<7",
  "eth-account>=0.10,<0.11",
  "hexbytes>=0.3.0",
  "httpx>=0.25",
  "pydantic>=2.6,<3",
  "apscheduler>=3.10",
  "tenacity>=8.2",
  "pytest>=8.2",
]

[dependency-groups]
dev = [
  "ruff",
  "mypy",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
include = ["cartha_validator"]
